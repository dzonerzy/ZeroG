site_name: ZeroG
site_description: A single-process WebKit engine with a small, stable C API, linked statically into your application.
site_url: https://dzonerzy.github.io/ZeroG/
repo_url: https://github.com/dzonerzy/ZeroG
repo_name: dzonerzy/ZeroG
edit_uri: edit/main/docs/
copyright: ZeroG contributors

theme:
  name: material
  logo: assets/logo/mark.svg
  favicon: assets/logo/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
