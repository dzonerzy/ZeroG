# Publishes the documentation site (mkdocs.yml, docs/) to GitHub Pages from main.
# Pages must be enabled for the repository with "GitHub Actions" as its source.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, include/zerog.h, tools/apidoc.py]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material
      - run: python tools/apidoc.py --check
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
